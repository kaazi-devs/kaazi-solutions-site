<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="KAazi Solutions — Compute for AI. From the rack to the agent.">
  <rect width="1200" height="630" fill="#0B0C0F"/>

  <!-- faint grid, matching the site's rule colour -->
  <g stroke="#EDECE6" stroke-opacity="0.04" stroke-width="1" fill="none">
    <path d="M0 126h1200M0 252h1200M0 378h1200M0 504h1200"/>
    <path d="M200 0v630M400 0v630M600 0v630M800 0v630M1000 0v630"/>
  </g>

  <!-- status bar (the site's signature strip) -->
  <rect x="0" y="0" width="1200" height="58" fill="#0B0C0F"/>
  <rect x="64" y="24" width="10" height="10" fill="#E66A55"/>
  <text x="90" y="34" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" letter-spacing="2.2" fill="#8C8E94" dominant-baseline="middle">INFRA / ROADMAP  ·  REGIONS / PLANNED  ·  US  ·  NG  ·  SOUTHERN AFRICA</text>
  <path d="M0 58h1200" stroke="#EDECE6" stroke-opacity="0.08" stroke-width="1"/>

  <!-- brand mark + wordmark -->
  <g transform="translate(64,110) scale(1.5)">
    <rect x="8" y="4" width="4" height="24" fill="#EDECE6"/>
    <polygon points="12,12 26,4 26,8 12,16" fill="#EDECE6"/>
    <polygon points="12,16 26,24 26,28 12,20" fill="#E66A55"/>
  </g>
  <text x="126" y="145" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.3" fill="#EDECE6">KAazi Solutions</text>

  <!-- headline -->
  <text x="64" y="345" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#EDECE6">Compute for AI.</text>
  <text x="64" y="445" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#EDECE6">From the rack <tspan fill="#E66A55">to the agent.</tspan></text>

  <!-- footer rule + meta line -->
  <path d="M64 530h1072" stroke="#EDECE6" stroke-opacity="0.08" stroke-width="1"/>
  <text x="64" y="578" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" letter-spacing="2.6" fill="#EDECE6">KAAZIDEVS.COM</text>
  <text x="1136" y="578" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" letter-spacing="2.6" fill="#8C8E94">NODES · PLATFORM · AGENTS</text>
</svg>
